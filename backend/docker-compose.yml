version: "3.8"

services:
  vectoraidb:
    image: williamimoh/actian-vectorai-db:1.0b
    ports:
      - "50051:50051"
    restart: unless-stopped

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    depends_on:
      - mongo
      - vectoraidb
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mongo_data:
