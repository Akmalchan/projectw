services:
  vectoraidb:
    image: williamimoh/actian-vectorai-db:1.0b
    restart: unless-stopped
    ports:
      - "50051:50051"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc 'echo > /dev/tcp/127.0.0.1/50051'"]
      interval: 10s
      timeout: 3s
      retries: 20

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
      vectoraidb:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  mongo_data:
